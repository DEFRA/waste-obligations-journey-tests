################################################################################
# Docker Compose file for running the Playwright journey tests in a container.
#
# Playwright ships its own browser binaries inside the test container, so there
# is no separate selenium/browser service here. The application under test runs
# elsewhere (typically on the host on http://host.docker.internal:<port>).
#
# Allure results/report are volume-mounted so they survive the container.
# PUBLISH_TEST_RESULTS=0 disables the S3 upload step for local runs.
################################################################################
services:
  waste-obligations-journey-tests:
    build: .
    platform: linux/amd64
    environment:
      PUBLISH_TEST_RESULTS: 0
    volumes:
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
