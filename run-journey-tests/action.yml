name: Run Waste Obligations journey profiles
description: Start a dedicated Waste Obligations CI stack and run the E2E, accessibility and security journey profiles.

inputs:
  journey-tests-ref:
    description: Ref of this repository to check out when called from another repository. Leave empty when this repository is already checked out.
    default: main
  waste-obligations:
    description: Waste Obligations commit SHA to check out and build locally. Leave empty to build the matching branch when present, otherwise use main CI assets and the published image.
    required: false
  waste-obligations-frontend:
    description: Waste Obligations frontend commit SHA to check out and build locally. Leave empty to build the matching branch when present, otherwise use main CI assets and the published image.
    required: false
  packaging-waste-proxy:
    description: Packaging waste proxy commit SHA to check out and build locally. Leave empty to build the matching branch when present, otherwise pull its published image.
    required: false
  project:
    description: Playwright project to run. chromium-based chrome-android is the CI default.
    default: chrome-android

runs:
  using: composite
  steps:
    - name: Checkout journey tests
      if: inputs.journey-tests-ref != ''
      uses: actions/checkout@v7
      with:
        repository: DEFRA/waste-obligations-journey-tests
        ref: ${{ inputs.journey-tests-ref }}
        path: journey-tests

    - name: Use checked-out journey tests
      if: inputs.journey-tests-ref != ''
      shell: bash
      run: |
        echo "JOURNEY_TESTS_PATH=$GITHUB_WORKSPACE/journey-tests" >> "$GITHUB_ENV"
        echo "JOURNEY_TESTS_NODE_VERSION_FILE=journey-tests/.nvmrc" >> "$GITHUB_ENV"
        echo "JOURNEY_TESTS_PACKAGE_LOCK=journey-tests/package-lock.json" >> "$GITHUB_ENV"

    - name: Use caller checkout
      if: inputs.journey-tests-ref == ''
      shell: bash
      run: |
        echo "JOURNEY_TESTS_PATH=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        echo "JOURNEY_TESTS_NODE_VERSION_FILE=.nvmrc" >> "$GITHUB_ENV"
        echo "JOURNEY_TESTS_PACKAGE_LOCK=package-lock.json" >> "$GITHUB_ENV"

    - name: Resolve service revisions
      id: service-refs
      shell: bash
      env:
        JOURNEY_BRANCH: ${{ github.head_ref || github.ref_name }}
        BACKEND_SHA: ${{ inputs.waste-obligations }}
        FRONTEND_SHA: ${{ inputs.waste-obligations-frontend }}
        PROXY_SHA: ${{ inputs.packaging-waste-proxy }}
      run: |
        set -euo pipefail
        resolve_service() {
          local repository="$1" revision="$2" prefix="$3" remote_ref status
          if [ -z "$revision" ]; then
            if remote_ref=$(git ls-remote --exit-code --heads "https://github.com/DEFRA/$repository.git" "refs/heads/$JOURNEY_BRANCH"); then
              revision="${remote_ref%%[[:space:]]*}"
            else
              status=$?
              if [ "$status" -ne 2 ]; then
                echo "Failed to resolve $repository branch $JOURNEY_BRANCH" >&2
                return "$status"
              fi
            fi
          fi
          echo "$repository=$revision" >> "$GITHUB_OUTPUT"
          echo "${prefix}_REF=$revision" >> "$GITHUB_ENV"
          if [ -n "$revision" ]; then
            echo "$repository: building $revision locally"
            echo "${prefix}_IMAGE=local/$repository:journey-tests" >> "$GITHUB_ENV"
            echo "${prefix}_PULL_POLICY=never" >> "$GITHUB_ENV"
          else
            echo "$repository: no matching branch; using the published image"
          fi
        }
        resolve_service waste-obligations "$BACKEND_SHA" WASTE_OBLIGATIONS
        resolve_service waste-obligations-frontend "$FRONTEND_SHA" WASTE_OBLIGATIONS_FRONTEND
        resolve_service packaging-waste-proxy "$PROXY_SHA" PACKAGING_WASTE_PROXY

    - name: Checkout Waste Obligations source assets
      uses: actions/checkout@v7
      with:
        repository: DEFRA/waste-obligations
        ref: ${{ steps.service-refs.outputs.waste-obligations || 'main' }}
        path: waste-obligations-source

    - name: Use Waste Obligations source assets
      shell: bash
      run: echo "WASTE_OBLIGATIONS_SOURCE_DIR=$GITHUB_WORKSPACE/waste-obligations-source" >> "$GITHUB_ENV"

    - name: Log into container registries
      uses: DEFRA/cdp-build-action/docker-login@main

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Checkout Waste Obligations frontend source assets
      uses: actions/checkout@v7
      with:
        repository: DEFRA/waste-obligations-frontend
        ref: ${{ steps.service-refs.outputs.waste-obligations-frontend || 'main' }}
        path: waste-obligations-frontend-source

    - name: Use Waste Obligations frontend source assets
      shell: bash
      run: echo "WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR=$GITHUB_WORKSPACE/waste-obligations-frontend-source" >> "$GITHUB_ENV"

    - name: Checkout packaging waste proxy source
      if: steps.service-refs.outputs.packaging-waste-proxy != ''
      uses: actions/checkout@v7
      with:
        repository: DEFRA/packaging-waste-proxy
        ref: ${{ steps.service-refs.outputs.packaging-waste-proxy }}
        path: packaging-waste-proxy-source

    # Selected images stay on the same runner, so concurrent Buildx processes can
    # build them in parallel without publishing or transferring test images.
    - name: Build selected service images in parallel
      if: steps.service-refs.outputs.waste-obligations != '' || steps.service-refs.outputs.waste-obligations-frontend != '' || steps.service-refs.outputs.packaging-waste-proxy != ''
      shell: bash
      run: |
        set -euo pipefail
        build_pids=()
        build_names=()

        if [ -n "$WASTE_OBLIGATIONS_REF" ]; then
          docker buildx build \
            --cache-from type=gha,scope=waste-obligations \
            --cache-to type=gha,mode=max,scope=waste-obligations \
            --load \
            --tag local/waste-obligations:journey-tests \
            "$GITHUB_WORKSPACE/waste-obligations-source" &
          build_pids+=("$!")
          build_names+=("Waste Obligations")
        fi

        if [ -n "$WASTE_OBLIGATIONS_FRONTEND_REF" ]; then
          docker buildx build \
            --cache-from type=gha,scope=waste-obligations-frontend \
            --cache-to type=gha,mode=max,scope=waste-obligations-frontend \
            --load \
            --target production \
            --tag local/waste-obligations-frontend:journey-tests \
            "$GITHUB_WORKSPACE/waste-obligations-frontend-source" &
          build_pids+=("$!")
          build_names+=("Waste Obligations frontend")
        fi

        if [ -n "$PACKAGING_WASTE_PROXY_REF" ]; then
          docker buildx build \
            --cache-from type=gha,scope=packaging-waste-proxy \
            --cache-to type=gha,mode=max,scope=packaging-waste-proxy \
            --load \
            --tag local/packaging-waste-proxy:journey-tests \
            "$GITHUB_WORKSPACE/packaging-waste-proxy-source" &
          build_pids+=("$!")
          build_names+=("Packaging waste proxy")
        fi

        build_failed=0
        for index in "${!build_pids[@]}"; do
          if ! wait "${build_pids[$index]}"; then
            echo "${build_names[$index]} image build failed" >&2
            build_failed=1
          fi
        done
        exit "$build_failed"

    - uses: actions/setup-node@v7
      with:
        node-version-file: ${{ env.JOURNEY_TESTS_NODE_VERSION_FILE }}
        cache: npm
        cache-dependency-path: ${{ env.JOURNEY_TESTS_PACKAGE_LOCK }}

    - name: Install journey-test dependencies
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: npm ci

    - name: Check journey helpers
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: npm run test:unit

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-browsers-${{ runner.os }}-${{ hashFiles(env.JOURNEY_TESTS_PACKAGE_LOCK) }}

    - name: Prepare dedicated CI stack
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: |
        set -euo pipefail
        : "${WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET:?WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET must be set}"
        : "${GOVUK_NOTIFY_API_KEY:?GOVUK_NOTIFY_API_KEY must be set}"

        stack_runtime_dir="$RUNNER_TEMP/waste-obligations-journey-tests"
        mkdir -p "$stack_runtime_dir/certs"
        openssl req -x509 -newkey rsa:2048 -sha256 -nodes \
          -keyout "$stack_runtime_dir/certs/localhost.key" \
          -out "$stack_runtime_dir/certs/localhost.crt" \
          -days 1 \
          -subj '/CN=localhost' \
          -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'

        echo "CI_STACK_RUNTIME_DIR=$stack_runtime_dir" >> "$GITHUB_ENV"

    - name: Validate dedicated CI stack configuration
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: |
        docker compose \
          -f ci/compose.yml \
          -f "$WASTE_OBLIGATIONS_SOURCE_DIR/compose/journey-tests.compose.yml" \
          -f "$WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR/compose/journey-tests.compose.yml" \
          config -q

    - name: Install Playwright Chromium while starting dedicated CI stack
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: |
        set -euo pipefail
        docker compose \
          --project-name waste-obligations-journey-tests \
          -f ci/compose.yml \
          -f "$WASTE_OBLIGATIONS_SOURCE_DIR/compose/journey-tests.compose.yml" \
          -f "$WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR/compose/journey-tests.compose.yml" \
          up --detach --wait --wait-timeout 900 --quiet-pull &
        stack_pid=$!

        browser_status=0
        npx playwright install --with-deps chromium || browser_status=$?

        stack_status=0
        wait "$stack_pid" || stack_status=$?

        if [ "$browser_status" -ne 0 ]; then
          echo "Playwright Chromium installation failed" >&2
        fi
        if [ "$stack_status" -ne 0 ]; then
          echo "Dedicated CI stack startup failed" >&2
        fi
        if [ "$browser_status" -ne 0 ] || [ "$stack_status" -ne 0 ]; then
          exit 1
        fi

    - name: Confirm local services are reachable
      shell: bash
      run: |
        curl --fail --retry 12 --retry-delay 5 http://localhost:8007/health
        curl --fail --insecure --retry 12 --retry-delay 5 https://localhost:8015/health

    - name: Run e2e journeys
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      env:
        ENVIRONMENT: local
        JOURNEY_ENTRY_POINT: waste-obligations
        EPR_BASE_URL: https://localhost:8015/manage-recycling-obligations/
        WASTE_OBLIGATIONS_API_BASE_URL: ''
        WASTE_OBLIGATIONS_API_TOKEN_URL: ''
        WASTE_OBLIGATIONS_API_CLIENT_ID: ''
        WASTE_OBLIGATIONS_API_CLIENT_SECRET: ''
        WASTE_OBLIGATION_USERNAME: Developer
        WASTE_OBLIGATION_PASSWORD: developer-pwd
        JOURNEY_USER: Developer
        JOURNEY_PASSWORD: developer-pwd
      run: PROFILE=e2e npx playwright test --project=${{ inputs.project }} --output=test-results/e2e

    - name: Run accessibility journeys
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      env:
        ENVIRONMENT: local
        JOURNEY_ENTRY_POINT: waste-obligations
        EPR_BASE_URL: https://localhost:8015/manage-recycling-obligations/
        WASTE_OBLIGATIONS_API_BASE_URL: ''
        WASTE_OBLIGATIONS_API_TOKEN_URL: ''
        WASTE_OBLIGATIONS_API_CLIENT_ID: ''
        WASTE_OBLIGATIONS_API_CLIENT_SECRET: ''
        WASTE_OBLIGATION_USERNAME: Developer
        WASTE_OBLIGATION_PASSWORD: developer-pwd
        JOURNEY_USER: Developer
        JOURNEY_PASSWORD: developer-pwd
      run: PROFILE=accessibility npx playwright test --project=${{ inputs.project }} --output=test-results/accessibility

    - name: Run security journeys
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      env:
        ENVIRONMENT: local
        JOURNEY_ENTRY_POINT: waste-obligations
        EPR_BASE_URL: https://localhost:8015/manage-recycling-obligations/
        WASTE_OBLIGATIONS_API_BASE_URL: ''
        WASTE_OBLIGATIONS_API_TOKEN_URL: ''
        WASTE_OBLIGATIONS_API_CLIENT_ID: ''
        WASTE_OBLIGATIONS_API_CLIENT_SECRET: ''
        WASTE_OBLIGATION_USERNAME: Developer
        WASTE_OBLIGATION_PASSWORD: developer-pwd
        JOURNEY_USER: Developer
        JOURNEY_PASSWORD: developer-pwd
      run: ./ci/run-security-profile.sh ${{ inputs.project }}

    - name: Generate Allure report
      if: always()
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: npm run report

    - name: Collect dedicated CI stack logs
      if: always()
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: |
        docker compose \
          --project-name waste-obligations-journey-tests \
          -f ci/compose.yml \
          -f "$WASTE_OBLIGATIONS_SOURCE_DIR/compose/journey-tests.compose.yml" \
          -f "$WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR/compose/journey-tests.compose.yml" \
          logs --no-color > docker-compose.log

    - name: Upload journey artefacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: waste-obligations-journeys-${{ inputs.project }}
        path: |
          ${{ env.JOURNEY_TESTS_PATH }}/test-results/
          ${{ env.JOURNEY_TESTS_PATH }}/allure-results/
          ${{ env.JOURNEY_TESTS_PATH }}/allure-report/
          ${{ env.JOURNEY_TESTS_PATH }}/reports/
          ${{ env.JOURNEY_TESTS_PATH }}/security-report/
          ${{ env.JOURNEY_TESTS_PATH }}/docker-compose.log
        if-no-files-found: warn

    - name: Stop dedicated CI stack
      if: always()
      working-directory: ${{ env.JOURNEY_TESTS_PATH }}
      shell: bash
      run: |
        docker compose \
          --project-name waste-obligations-journey-tests \
          -f ci/compose.yml \
          -f "$WASTE_OBLIGATIONS_SOURCE_DIR/compose/journey-tests.compose.yml" \
          -f "$WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR/compose/journey-tests.compose.yml" \
          down --volumes --remove-orphans
