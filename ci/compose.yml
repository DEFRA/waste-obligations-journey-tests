name: waste-obligations-journey-tests

# This is deliberately a small, standalone stack. It does not import an
# epr-local-environment profile: the journey tests own the orchestration and
# scenario data, while service repositories own their infrastructure setup.
#
# Service-owned Compose fragments are merged with this file by the action.
# WASTE_OBLIGATIONS_SOURCE_DIR and WASTE_OBLIGATIONS_FRONTEND_SOURCE_DIR
# identify the selected checkouts; the journey repository does not copy their
# setup logic.

services:
  # Two-second startup and readiness probes shorten the CI dependency chain.
  # Retry counts retain each service's previous overall readiness allowance.
  mongodb:
    image: mongo:7.0.24
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok }"
        ]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s
      start_interval: 2s

  redis:
    image: redis:7.2.3-alpine3.18
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 13

  floci:
    image: floci/floci:latest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s
      start_interval: 2s

  wiremock:
    image: sheyenrath/wiremock.net:latest
    volumes:
      - ${CI_STACK_RUNTIME_DIR:?CI_STACK_RUNTIME_DIR must identify the generated CI stack directory}/wiremock:/app/__admin/mappings:ro
    command:
      [
        "--ReadStaticMappings",
        "true",
        "--WatchStaticMappingsInSubdirectories",
        "true",
        "--WireMockLogger",
        "WireMockConsoleLogger"
      ]
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/80'"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s
      start_interval: 2s

  waste-organisations:
    image: ${WASTE_ORGANISATIONS_IMAGE:-defradigital/waste-organisations:latest}
    pull_policy: always
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__DatabaseUri: mongodb://mongodb:27017/
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EMF_ENABLED: "false"
      AWS_EMF_ENVIRONMENT: Local
      Acl__Clients__Developer__Type: ApiKey
      Acl__Clients__Developer__Secret: developer-pwd
      Acl__Clients__Developer__Scopes__0: read
      Acl__Clients__Developer__Scopes__1: write
      Acl__Clients__waste-obligations__Type: ApiKey
      Acl__Clients__waste-obligations__Secret: waste-obligations-pwd
      Acl__Clients__waste-obligations__Scopes__0: read
      Acl__Clients__waste-obligations-frontend__Type: ApiKey
      Acl__Clients__waste-obligations-frontend__Secret: waste-obligations-frontend-pwd
      Acl__Clients__waste-obligations-frontend__Scopes__0: read
      Acl__Clients__waste-organisations-seed__Type: ApiKey
      Acl__Clients__waste-organisations-seed__Secret: waste-organisations-seed-pwd
      Acl__Clients__waste-organisations-seed__Scopes__0: read
      Acl__Clients__waste-organisations-seed__Scopes__1: write
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s
      start_interval: 2s

  # Scenario data is owned by the journey suite because the tests choose the
  # identifiers and assertions. It is seeded through the public service API,
  # not by reaching into MongoDB.
  waste-organisations-seed:
    image: node:22-alpine
    depends_on:
      waste-organisations:
        condition: service_healthy
    environment:
      WASTE_OBLIGATION_ORG_ID: ${WASTE_OBLIGATION_ORG_ID:?WASTE_OBLIGATION_ORG_ID must be set}
      WASTE_OBLIGATION_CSO_ORG_ID: ${WASTE_OBLIGATION_CSO_ORG_ID:?WASTE_OBLIGATION_CSO_ORG_ID must be set}
    volumes:
      - ./seed-waste-organisations.mjs:/seed.mjs:ro
    entrypoint: ["node", "/seed.mjs"]

  waste-obligations:
    image: ${WASTE_OBLIGATIONS_IMAGE:-defradigital/waste-obligations:latest}
    pull_policy: ${WASTE_OBLIGATIONS_PULL_POLICY:-always}
    depends_on:
      mongodb:
        condition: service_healthy
      floci:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      waste-organisations:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__DatabaseUri: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true&readPreference=secondaryPreferred
      AWS_ENDPOINT_URL: http://floci:4566
      AWS__AuthenticationRegion: eu-west-2
      AWS__ServiceURL: http://floci:4566
      AWS_REGION: eu-west-2
      AWS_DEFAULT_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_EMF_ENABLED: "false"
      AWS_EMF_ENVIRONMENT: Local
      AnalyticsAuditEventProcessor__ProcessingEnabled: "true"
      AnalyticsAuditEventProcessor__ProcessName: analytics
      AnalyticsAuditEventProcessor__TopicArn: arn:aws:sns:eu-west-2:000000000000:waste_obligations_analytics_events
      AnalyticsAuditEventProcessor__PollIntervalSeconds: 1
      AnalyticsAuditEventProcessor__PollJitterSeconds: 0
      AnalyticsAuditEventConsumer__QueueUrl: http://floci:4566/000000000000/waste_obligations_analytics_events_queue
      Acl__Clients__Developer__Type: ApiKey
      Acl__Clients__Developer__Secret: developer-pwd
      Acl__Clients__Developer__Scopes__0: read
      Acl__Clients__Developer__Scopes__1: write
      Acl__Clients__waste-obligations-frontend__Type: ApiKey
      Acl__Clients__waste-obligations-frontend__Secret: waste-obligations-frontend-pwd
      Acl__Clients__waste-obligations-frontend__Scopes__0: read
      Acl__Clients__waste-obligations-frontend__Scopes__1: write
      PrnCommonBackend__TokenEndpoint: http://wiremock/oauth2/v2.0/token
      PrnCommonBackend__ClientId: waste-obligations
      PrnCommonBackend__ClientSecret: waste-obligations-pwd
      PrnCommonBackend__Scope: api://prn-common/.default
      PrnCommonBackend__BaseAddress: http://wiremock/
      WasteOrganisations__BaseAddress: http://waste-organisations:8080/
      WasteOrganisations__ClientId: waste-obligations
      WasteOrganisations__ClientSecret: waste-obligations-pwd
      AccountBackend__TokenEndpoint: http://wiremock/oauth2/v2.0/token
      AccountBackend__ClientId: waste-obligations
      AccountBackend__ClientSecret: waste-obligations-pwd
      AccountBackend__Scope: api://backend-account/.default
      AccountBackend__BaseAddress: http://wiremock/
      GovukNotify__BaseAddress: http://wiremock/
      GovukNotify__ApiKey: ${GOVUK_NOTIFY_API_KEY:?GOVUK_NOTIFY_API_KEY must be set}
    ports:
      - "${WASTE_OBLIGATIONS_HOST_PORT:-8007}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 2s
      timeout: 5s
      retries: 25
      start_period: 5s
      start_interval: 2s

  waste-obligations-frontend:
    image: ${WASTE_OBLIGATIONS_FRONTEND_IMAGE:-defradigital/waste-obligations-frontend:latest}
    pull_policy: ${WASTE_OBLIGATIONS_FRONTEND_PULL_POLICY:-always}
    depends_on:
      redis:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      waste-obligations:
        condition: service_healthy
      waste-organisations:
        condition: service_healthy
      waste-organisations-seed:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_TLS: "false"
      USE_SINGLE_INSTANCE_CACHE: "true"
      WASTE_ORGANISATIONS_API_BASE_URL: http://waste-organisations:8080/
      WASTE_ORGANISATIONS_API_AUTH_MODE: basic
      WASTE_ORGANISATIONS_API_CLIENT_ID: waste-obligations-frontend
      WASTE_ORGANISATIONS_API_CLIENT_SECRET: waste-obligations-frontend-pwd
      WASTE_OBLIGATIONS_API_BASE_URL: http://waste-obligations:8080/
      WASTE_OBLIGATIONS_API_AUTH_MODE: basic
      WASTE_OBLIGATIONS_API_CLIENT_ID: waste-obligations-frontend
      WASTE_OBLIGATIONS_API_CLIENT_SECRET: waste-obligations-frontend-pwd
      BACKEND_ACCOUNT_API_BASE_URL: http://wiremock/api/
      BACKEND_ACCOUNT_API_AUTH_MODE: bearer
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_ID: waste-obligations-frontend
      BACKEND_ACCOUNT_API_OAUTH_CLIENT_SECRET: waste-obligations-frontend-pwd
      BACKEND_ACCOUNT_API_OAUTH_TOKEN_ENDPOINT: http://wiremock/oauth2/v2.0/token
      BACKEND_ACCOUNT_API_OAUTH_SCOPE: api://backend-account/.default
      EPR_PACKAGING_HOME_URL: https://localhost:8010/
      EPR_PACKAGING_MANAGE_ACCOUNT_URL: https://localhost:8010/manage-account
      EPR_PACKAGING_CLEAR_SESSION_URL: https://localhost:8010/sign-out
      EPR_PACKAGING_SIGN_IN_URL: https://localhost:8010/sign-in
      EPR_PACKAGING_COOKIES_URL: https://localhost:8010/cookies
      MANAGE_YOUR_RECYCLING_OBLIGATIONS_URL: https://localhost:8010/
      AZURE_AD_B2C_CLIENT_ID: 1a512714-ecd4-44f1-ad60-8229da59fb52
      AZURE_AD_B2C_CLIENT_SECRET: ${WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET:?WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET must be set}
      AZURE_AD_B2C_INSTANCE: https://AZDCUSPOC2.b2clogin.com
      AZURE_AD_B2C_DOMAIN: AZDCUSPOC2.onmicrosoft.com
      AZURE_AD_B2C_TENANT_ID: 8a3f509a-c892-4bec-bfe9-d5f5cf251813
      AZURE_AD_B2C_USER_FLOW: B2C_1A_EPR_SignUpSignIn
      AZURE_AD_B2C_POST_LOGOUT_REDIRECT_PATH: /signed-out
      AUTH_COOKIE_PASSWORD: secret-password-must-be-at-least-32-characters-long
      AUTH_COOKIE_SECURE: "true"
      SESSION_COOKIE_PASSWORD: the-password-must-be-at-least-32-characters-long
      SESSION_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect({host:'127.0.0.1', port:3000}).once('connect', () => process.exit(0)).once('error', () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 15s
      start_interval: 2s

  waste-obligations-frontend-proxy:
    image: nginx:1.27-alpine
    depends_on:
      waste-obligations-frontend:
        condition: service_healthy
    ports:
      - "${WASTE_OBLIGATIONS_FRONTEND_HOST_PORT:-8010}:443"
    volumes:
      - ./waste-obligations-frontend-proxy.conf:/etc/nginx/nginx.conf:ro
      - ${CI_STACK_RUNTIME_DIR:?CI_STACK_RUNTIME_DIR must identify the generated CI stack directory}/certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --no-check-certificate https://127.0.0.1/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
      start_interval: 2s
