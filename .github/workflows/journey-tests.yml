name: Run Waste Obligations e2e journeys

on:
  workflow_dispatch:
    inputs:
      waste-obligations:
        description: Optional Waste Obligations commit SHA to check out and build locally; otherwise main assets and the published image are used.
        required: false
        type: string
      waste-obligations-frontend:
        description: Optional Waste Obligations frontend commit SHA to check out and build locally; otherwise main assets and the published image are used.
        required: false
        type: string
  workflow_call:
    inputs:
      waste-obligations:
        description: Optional Waste Obligations commit SHA to check out and build locally; otherwise main assets and the published image are used.
        required: false
        type: string
      waste-obligations-frontend:
        description: Optional Waste Obligations frontend commit SHA to check out and build locally; otherwise main assets and the published image are used.
        required: false
        type: string
    secrets:
      EPR_USER_EMAIL:
        required: true
      EPR_USER_PASSWORD:
        required: true
      EPR_CSO_USER_EMAIL:
        required: true
      EPR_CSO_USER_PASSWORD:
        required: true
      WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET:
        required: true
      GOVUK_NOTIFY_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  e2e:
    name: DP and CSO lifecycle (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Run journeys
        uses: ./run-journey-tests
        with:
          journey-tests-ref: ''
          waste-obligations: ${{ inputs.waste-obligations }}
          waste-obligations-frontend: ${{ inputs.waste-obligations-frontend }}
        env:
          EPR_USER_EMAIL: ${{ secrets.EPR_USER_EMAIL }}
          EPR_USER_PASSWORD: ${{ secrets.EPR_USER_PASSWORD }}
          EPR_CSO_USER_EMAIL: ${{ secrets.EPR_CSO_USER_EMAIL }}
          EPR_CSO_USER_PASSWORD: ${{ secrets.EPR_CSO_USER_PASSWORD }}
          WASTE_OBLIGATION_ORG_ID: e2316c5e-d434-41da-8274-494dc0762d20
          WASTE_OBLIGATION_CSO_ORG_ID: d93376e3-0681-46be-aeb4-7450a2e784d8
          WASTE_OBLIGATION_SUBMITTER_ID: 98b1e75b-5f36-4d0e-91ae-84fe9b6ce794
          WASTE_OBLIGATION_SUBMITTER_EMAIL: submitter@example.com
          WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET: ${{ secrets.WASTE_OBLIGATIONS_FRONTEND_B2C_CLIENT_SECRET }}
          GOVUK_NOTIFY_API_KEY: ${{ secrets.GOVUK_NOTIFY_API_KEY }}
